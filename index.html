<style>
:root{--bg:#1b1c2a;--panel:#262839;--panel2:#20303f;--line:#3a3d52;--text:#fff;--muted:#a9adc4;--yellow:#ffd966;--coral:#ff8a80;--mint:#a8e6cf;--sky:#8fd3f4;--ink:#262839;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#1b1c2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,"Noto Sans Devanagari",system-ui,sans-serif;line-height:1.5;min-height:100%}
h1,h2,h3,.logo{font-family:Fredoka,"Noto Sans Devanagari",Poppins,sans-serif;margin:0}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
.logo i{width:38px;height:38px;border-radius:10px;background:var(--sky);display:grid;place-items:center;font-style:normal}
.logo b{color:var(--coral)}
.in{width:100%;height:46px;border-radius:23px;border:2px solid var(--line);background:var(--panel);padding:0 18px;font-size:14px}
.bar .in{flex:1;min-width:0;height:44px}
.ibtn{position:relative;min-width:44px;height:44px;border-radius:22px;border:2px solid var(--line);background:var(--panel);font-size:16px;padding:0 12px}
.ibtn span{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--coral);color:var(--ink);font-size:11px;font-weight:600;display:grid;place-items:center}
.cta,.btn2{border:0;border-radius:24px;font-weight:600;padding:12px 26px;display:inline-block;text-align:center}
.cta{background:var(--coral);color:var(--ink);box-shadow:0 5px 0 #d9605a}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #d9605a}
.btn2{background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 #c9a73f}
.ghost{background:none;border:2px solid var(--line);border-radius:24px;padding:10px 22px;font-weight:500}
.hero{display:grid;grid-template-columns:1.3fr 1fr;margin:24px 0;border-radius:28px;background:var(--panel2);box-shadow:0 8px 0 var(--line);overflow:hidden}
.hero .t{padding:36px}
.hero h1{font-size:clamp(28px,4.5vw,42px);line-height:1.1}
.hero p{color:var(--muted);margin:10px 0 20px;max-width:36ch;font-size:14px}
.sun{position:relative;display:grid;place-items:center;min-height:200px}
.sun::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:var(--yellow)}
.blk{position:relative;display:flex;gap:8px;font-family:Fredoka;font-weight:700;font-size:30px;color:#262839}
.blk span{width:62px;height:62px;border-radius:14px;display:grid;place-items:center}
.perks{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:6px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:26px 0 16px}
.filters h2{font-size:24px;margin-right:auto}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
select{border:2px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;padding-bottom:40px}
.card{background:var(--panel);border-radius:22px;padding:12px;box-shadow:0 5px 0 var(--line)}
.pic{position:relative;height:150px;border-radius:16px;display:grid;place-items:center;font-size:64px}
.heart{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.8);font-size:18px;color:#9a9ab0}
.heart[aria-pressed="true"]{color:#e5484d}
.card h3{font-size:17px;margin:12px 4px 0}
.muted{color:var(--muted);font-size:12px;margin:0 4px}
.row{display:flex;justify-content:space-between;align-items:center;margin:10px 4px 2px;gap:8px}
.price{font-weight:600}.price s{color:var(--muted);font-weight:400;font-size:12px;margin-left:4px}
.add{border:0;border-radius:16px;background:var(--yellow);color:var(--ink);font-weight:600;font-size:13px;padding:7px 14px}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:30px}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin:28px 0}

.pd h1{font-size:34px}
.tag{display:inline-block;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:2px 12px;font-size:12px;margin:0 6px 6px 0}
.big{font-size:26px;font-weight:600;margin:12px 0}
.panel{background:var(--panel);border-radius:22px;padding:20px;box-shadow:0 5px 0 var(--line)}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;margin:24px 0 40px;align-items:start}
.line{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:2px solid var(--line)}
.line:last-child{border:0}
.line .th{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-size:32px;flex:none}
.line .nm{flex:1;min-width:0;font-weight:500}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none}
.sum div{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.sum .tot{font-weight:600;font-size:18px;border-top:2px solid var(--line);margin-top:6px;padding-top:10px}
.form{display:grid;gap:12px}
.form label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.form .in{height:44px;border-radius:14px}
.auth{max-width:440px;margin:40px auto;text-align:center}
.tabs{display:flex;background:#15161f;border-radius:26px;padding:4px;margin:16px 0}
.tabs button{flex:1;border:0;background:none;border-radius:22px;padding:9px;font-weight:600;color:#fff}
.tabs button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.err{color:var(--coral);font-size:13px;min-height:20px;margin:0}
.ok{font-size:64px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--yellow);color:var(--ink);padding:10px 20px;border-radius:22px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
footer{border-top:2px solid var(--line);color:var(--muted);font-size:12px;text-align:center;padding:18px}
@media(max-width:720px){.hero,.pd,.two{grid-template-columns:1fr}.hero .t{padding:26px}.logo span{display:none}.pd .pic{height:220px;font-size:90px}}
body.authpage header,body.authpage footer{display:none}
.lg{max-width:900px;margin:5vh auto;display:grid;grid-template-columns:1fr 1fr;border-radius:30px;overflow:hidden;background:var(--panel);box-shadow:0 10px 0 var(--line)}
.lgl{background:var(--panel2);padding:36px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.lgl h2{font-size:24px;margin-top:22px}
.art{position:relative;width:300px;height:260px}
.sunl{position:absolute;left:28px;top:0;width:246px;height:246px;border-radius:50%;background:var(--yellow)}
.bk{position:absolute;width:66px;height:66px;border-radius:14px;display:grid;place-items:center;font:700 30px Fredoka;color:#262839}
.face{position:absolute;width:64px;height:64px;border-radius:50%}
.face::before{content:"";position:absolute;top:34px;left:18px;width:6px;height:6px;border-radius:50%;background:#262839;box-shadow:22px 0 #262839}
.face::after{content:"";position:absolute;left:19px;top:40px;width:26px;height:12px;border:3px solid #262839;border-top:0;border-radius:0 0 26px 26px}
.dec{position:absolute;font-size:30px}
.lgr{padding:32px 36px}
.lgr h1{font-size:30px;margin-top:22px}
.soc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.soc .ghost{box-shadow:0 4px 0 var(--line);font-weight:600}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin-bottom:14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.fld{position:relative}
.fld span{position:absolute;left:16px;top:11px;font-size:16px}
.fld .in{padding-left:46px;padding-right:46px;height:50px;border-radius:25px}
.eye{position:absolute;right:8px;top:6px;width:38px;height:38px;border:0;background:none;font-size:18px}
.lnks{display:flex;justify-content:space-between;font-size:13px}
.trust{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.trust span{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:6px 14px;font-size:13px}
@media(max-width:720px){.lg{grid-template-columns:1fr;margin:16px auto}.lgl{display:none}.lgr{padding:26px 20px}}
.doc{max-width:760px;margin:28px auto}.doc h1{font-size:32px;margin-bottom:12px}.doc li{margin:8px 0}
details{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin:10px 0}summary{cursor:pointer;font-weight:600}
.tl{list-style:none;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0}
.tl li{text-align:center;font-size:12px;padding-top:28px;position:relative;color:var(--muted)}
.tl li::before{content:"";position:absolute;top:0;left:50%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--line)}
.tl li.on{color:var(--text)}.tl li.on::before{background:var(--mint)}.tl li.cur::before{background:var(--yellow);box-shadow:0 0 0 4px rgba(255,217,102,.35)}
.st{display:inline-block;font-size:12px;font-weight:600;border-radius:12px;padding:2px 10px;color:#262839}.st.i{background:var(--mint)}.st.l{background:var(--yellow)}.st.o{background:var(--coral)}
.rv{background:var(--panel);border-radius:16px;padding:12px 16px;margin:8px 0;box-shadow:0 3px 0 var(--line)}
.fl{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin-bottom:8px}.fl a{text-decoration:underline}
#nv{position:absolute;right:16px;top:100%;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:8px;min-width:210px;box-shadow:0 6px 0 var(--line)}
#nv[hidden]{display:none}#nv a{display:block;padding:9px 14px;border-radius:10px}#nv a:hover,#nv a:focus-visible{background:var(--panel2)}
button[disabled]{opacity:.5;cursor:not-allowed}textarea.in{height:auto;min-height:110px;border-radius:18px;padding:12px 18px;resize:vertical}
.okm{color:var(--mint);font-size:13px;min-height:20px;margin:0}.empty .ok{font-size:48px}
@media(max-width:720px){.bar{flex-wrap:wrap}.bar .in{order:9;flex-basis:100%}.tl{font-size:11px}}
.tel{font-size:24px;font-weight:600;text-decoration:underline}.cbox{margin:16px 0}.cbox h3{margin-bottom:6px}.cbox p{margin:6px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.pic svg{width:100%;height:100%}
.pd .pic{height:340px;border-radius:28px;overflow:hidden}
.thumbs{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.tb{width:78px;height:58px;border-radius:12px;border:2px solid var(--line);padding:0;overflow:hidden;font-size:12px;font-weight:600;background:var(--panel)}
.tb svg{width:100%;height:100%}.tb[aria-pressed="true"]{border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}
.tb.vb{width:auto;padding:0 14px}
.vid{position:relative;height:340px;border-radius:28px;overflow:hidden;display:grid;place-items:center}
.toy{font-size:110px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(6deg)}}
.caps{position:absolute;bottom:34px;left:0;right:0;height:26px;text-align:center}
.caps span{position:absolute;left:0;right:0;opacity:0;font-weight:600;font-size:18px;color:#262839;animation:cap 9s infinite}
.caps span:nth-child(2){animation-delay:3s}.caps span:nth-child(3){animation-delay:6s}
@keyframes cap{0%{opacity:0}5%,30%{opacity:1}35%,100%{opacity:0}}
.prog{position:absolute;bottom:0;left:0;right:0;height:6px;background:#0002}
.prog i{display:block;height:100%;background:#262839;animation:pg 9s linear infinite}
@keyframes pg{from{width:0}to{width:100%}}
.vid.pz *{animation-play-state:paused!important}
.lg{position:relative}.langs{position:absolute;top:14px;right:16px;display:flex;gap:6px;z-index:2}
.bar .sel,#lang{width:auto;flex:none;height:44px;border-radius:22px}
.tel{font-size:24px;font-weight:600;text-decoration:underline}.cbox{margin:16px 0}.cbox h3{margin-bottom:6px}.cbox p{margin:6px 0}
@media(prefers-reduced-motion:reduce){.toy,.prog i{animation:none!important}.caps span:first-child{opacity:1;animation:none!important}}
@media(max-width:720px){.pd .pic,.vid{height:240px}.langs{top:8px;right:10px}.lgr{padding-top:44px}}
#bot{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8}
body.authpage #bot{display:none}
.fab{width:58px;height:58px;border-radius:50%;border:0;background:var(--coral);color:#262839;font-size:26px;box-shadow:0 5px 0 #d9605a;float:right}
.bw{position:absolute;right:0;bottom:72px;width:min(360px,calc(100vw - 32px));height:min(500px,calc(100vh - 150px));background:var(--panel);border:2px solid var(--line);border-radius:22px;box-shadow:0 8px 0 var(--line);display:flex;flex-direction:column;overflow:hidden}
.bh{background:var(--yellow);color:#262839;font:600 17px Fredoka,"Noto Sans Devanagari",sans-serif;padding:12px 16px}
.bm{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:88%;padding:8px 12px;border-radius:16px;font-size:14px;white-space:pre-wrap}
.m.b{background:var(--panel2);align-self:flex-start;border-bottom-left-radius:4px}
.m.u{background:var(--coral);color:#262839;align-self:flex-end;border-bottom-right-radius:4px}
.bp{display:flex;gap:8px;align-items:center;background:var(--panel);border-radius:12px;padding:6px 8px;margin-top:6px;font-size:13px;white-space:normal}
.bp a{flex:1;text-decoration:underline}
.bp button{width:28px;height:28px;border-radius:50%;border:0;background:var(--yellow);color:#262839;font-weight:700}
.bq{display:flex;gap:6px;overflow-x:auto;padding:6px 10px}
.bq .chip{white-space:nowrap;flex:none;font-size:12px;padding:4px 10px}
.bf{display:flex;gap:8px;padding:10px;border-top:2px solid var(--line)}
.bf .in{height:42px;border-radius:21px;min-width:0}
.bf .cta{padding:8px 16px;box-shadow:0 3px 0 #d9605a}
</style>
</head>

ab_2=Our mission: make letters, numbers, logic and science fun for every child from age 0 to 10.|हमारा मिशन: 0 से 10 साल के हर बच्चे के लिए अक्षर, गिनती, तर्क और विज्ञान को मज़ेदार बनाना।|आमचे ध्येय: 0 ते 10 वर्षांच्या प्रत्येक मुलासाठी अक्षरे, संख्या, तर्क व विज्ञान मजेदार करणे.
ab_3=This website is a prototype demo. Products, reviews and stock are sample data.|यह वेबसाइट एक प्रोटोटाइप डेमो है। उत्पाद, समीक्षाएँ और स्टॉक नमूना डेटा हैं।|ही वेबसाइट प्रोटोटाइप डेमो आहे. उत्पादने, पुनरावलोकने व साठा नमुना डेटा आहे.

function handleForm(f){if(!f)return;var d=new FormData(f),fid=f.getAttribute("id");

    if(!/^\S+@\S+\.\S+$/.test(id)&&!/^\d{10}$/.test(id))return fail("e_id");
    var fin=function(msg){mode="login";otp=false;var u=S.users[id];S.user={id:id,name:u.name,ph:u.ph||"",ad:u.ad||""};save();count();toast(msg==="new"?t("tcreated"):t("twel")+", "+u.name.split(" ")[0]);go(keys(S.cart).length?"/cart":"/")};
    if(mode==="reset"){if(!S.users[id])return fail("e_noacc");if((d.get("code")||"").trim()!=="1234")return fail("e_code");if(pw.length<6)return fail("e_pw");
      return mkpw(pw).then(function(r){Object.assign(S.users[id],r);save();mode="login";otp=false;auth();toast(t("tresetok"))})}
    if(otp&&mode==="login"){if(!S.users[id])return fail("e_noacc");if(pw!=="1234")return fail("e_otp");return fin("old")}
    if(pw.length<6)return fail("e_pw");
    var u=S.users[id];
    if(mode==="signup"){if(u)return fail("e_ex");return mkpw(pw).then(function(r){S.users[id]={pw:r.pw,salt:r.salt,name:nmv};fin("new")})}
    if(!u||!u.pw)return fail("e_bad");
    hash(pw,u.salt).then(function(h){if(u.pw!==h&&u.pw!==pw)return fail("e_bad");u.pw=h;fin("old")})}
  if(fid==="co"){var ce=$("#ce"),nv2=d.get("n").trim(),ph=d.get("ph").trim(),ad=d.get("ad").trim(),pc=d.get("pc").trim();

    var bad=keys(S.cart).filter(function(k){return S.cart[k]>stk(by(k))});

    setTimeout(function(){it.forEach(function(i){S.sold[i[0]]=(S.sold[i[0]]||0)+i[1]});S.orders.unshift({id:oid,u:S.user.id,n:nv2,ph:ph,ad:ad,pc:pc,t:x.t,pm:pm,date:now,eta:eta,items:it});S.user.ph=ph;S.user.ad=ad;if(S.users[S.user.id]){S.users[S.user.id].ph=ph;S.users[S.user.id].ad=ad}S.cart={};S.coupon=false;save();go("/done/"+oid)},700)}
  if(fid==="ct"){var v={n:d.get("n").trim(),e:d.get("e").trim(),s:d.get("s").trim(),m:d.get("m").trim()},cm=$("#cm");
    if(v.n.length<2||!/^\S+@\S+\.\S+$/.test(v.e)||v.s.length<3||v.m.length<10){cm.className="err";cm.textContent=t("c_err");return}
    v.d=new Date().toISOString();S.msgs.push(v);S.msgs=S.msgs.slice(-20);save();f.reset();cm.className="okm";cm.textContent=t("c_ok")}
  if(fid==="pf"){var ph2=d.get("ph").trim(),n2=d.get("n").trim();if(n2.length<2||(ph2&&!/^\d{10}$/.test(ph2))){toast(t("e_form"));return}
    S.user.name=n2;S.user.ph=ph2;S.user.ad=d.get("ad").trim();if(S.users[S.user.id])Object.assign(S.users[S.user.id],{name:n2,ph:ph2,ad:S.user.ad});save();count();toast(t("profok"))}
}

function local(q){var s=q.toLowerCase(),n=s.match(/\d+/),num=n?+n[0]:null;
  if(/order|track|ऑर्डर|ट्रैक|ट्रॅक/.test(s)){var o=mine()[0];return o?{t:t("bot_ord")+": "+o.id+" · "+R(o.t)+" · "+t("st_"+stg(o))+" · "+t("arrive")+" "+dt(o.eta)}:{k:"bot_ord0"}}
  if(/deliver|ship|return|refund|डिलीवरी|डिलिव्हरी|वापसी|परतावा/.test(s))return{k:"bot_deliv"};
  if(/coupon|discount|offer|promo|\bcode\b|छूट|कूपन|सूट/.test(s))return{k:"bot_coup"};
  if(/\bpay|upi|\bcod\b|cash|भुगतान|पेमेंट/.test(s))return{k:"bot_pay"};
  var age=null,bud=null,sk=null;
  if(num!==null){if(num>=100)bud=num;else if(num<=12)age=num<=2?"0-2":num<=5?"3-5":"6+"}
  SKW.forEach(function(w){if(w[0].test(s))sk=w[1]});
  if(/baby|infant|toddler|newborn|शिशु|बेबी|बाळ/.test(s))age=age||"0-2";
  if(age||bud||sk){var l=P.filter(function(p){return(!age||p.a===age)&&(!bud||p.p<=bud)&&(!sk||p.s.indexOf(sk)>-1||p.c===sk)});
    return l.length?{k:"bot_rec",ids:l.slice(0,4).map(function(p){return p.id})}:{k:"bot_none",ids:[1,6,8,13]}}
  if(/^(hi|hii|hello|hey|नमस्ते|नमस्कार)/.test(s))return{k:"bot_greet"};
  return{k:"bot_fb"}}
async function ai(q){

  r=await smp.json(pr,{cache:false,modelTier:"quick"});
  return{t:String(r.reply||""),ids:(r.ids||[]).filter(function(i){return by(i)}).slice(0,4)}}
async function bsend(q){q=(q||"").trim();if(!q||BOT.busy)return;var i=$("#bi");if(i)i.value="";
  BOT.msgs.push({r:"u",t:q});BOT.busy=true;botUI();var res=null;
